name: Windows read-only smoke checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-powershell:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 smoke checks
        shell: powershell
        run: ./tests/Smoke.Tests.ps1
  powershell-7:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 7 smoke checks
        shell: pwsh
        run: ./tests/Smoke.Tests.ps1
