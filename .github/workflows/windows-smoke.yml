name: Windows read-only smoke checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Parse, compile and run read-only diagnosis
        shell: ${{ matrix.shell }}
        run: ./tests/Smoke.Tests.ps1
